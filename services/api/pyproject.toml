[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momo-fdvs-api"
version = "0.1.0"
description = "MoMo-FDVS Flask API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.5",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "flask-smorest==0.47.0",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.15.22",
  "types-Flask-Cors==6.0.0.20250809",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=momo_fdvs --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["momo_fdvs"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["momo_fdvs"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["flask_smorest.*", "flask_migrate.*", "flask_sqlalchemy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["INP001"]
"tests/*" = ["S105", "S106"]
